<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xanter MP3 - Offline Mode</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-music"></i>
                <h2>XANTER <span>MP3</span></h2>
            </div>
            
            <ul class="nav-links">
                <li class="active" onclick="switchTab('home')"><a href="#"><i class="fa-solid fa-house"></i> Home</a></li>
                <li onclick="switchTab('downloads')"><a href="#"><i class="fa-solid fa-download"></i> Downloads / Offline</a></li>
                <li><a href="#"><i class="fa-solid fa-fire"></i> Trending</a></li>
                <li><a href="#"><i class="fa-solid fa-heart"></i> Favorites</a></li>
            </ul>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <header class="top-bar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Tafuta nyimbo...">
                </div>
                <div class="user-actions">
                    <i class="fa-solid fa-bell"></i>
                    <i class="fa-solid fa-user-circle" style="font-size: 1.5rem;"></i>
                </div>
            </header>

            <!-- HOME SECTION -->
            <div id="home-section" class="tab-content">
                <section class="hero-banner">
                    <div class="hero-text">
                        <span class="badge">NEW MUSIC</span>
                        <h1>Discover & Enjoy<br>Your Favorite <span>Music</span></h1>
                        <p>Sikiliza nyimbo mpya na uzihifadhi usikilize hata bila bando.</p>
                    </div>
                </section>

                <section class="section-box">
                    <div class="section-header">
                        <h3>Trending Songs (Bofya kupakua Offline)</h3>
                    </div>
                    <ul class="song-list" id="trending-list">
                        <!-- Zitajazwa na JavaScript -->
                    </ul>
                </section>
            </div>

            <!-- DOWNLOADS / OFFLINE SECTION -->
            <div id="downloads-section" class="tab-content" style="display: none;">
                <section class="section-box">
                    <div class="section-header">
                        <h3>📥 Nyimbo Zangu za Offline (<span id="offline-count">0</span>)</h3>
                    </div>
                    <ul class="song-list" id="offline-list">
                        <!-- Nyimbo zilizohifadhiwa zitaonekana hapa -->
                    </ul>
                </section>
            </div>
        </main>
    </div>

    <!-- MUSIC PLAYER BAR -->
    <div class="player-bar">
        <div class="now-playing">
            <div class="song-info-text">
                <h4 id="player-title">Chagua Wimbo</h4>
                <p id="player-artist">Xanter MP3</p>
            </div>
        </div>
        <div class="player-center">
            <div class="player-controls">
                <i class="fa-solid fa-backward-step" id="prev-btn"></i>
                <i class="fa-solid fa-circle-play main-play" id="play-pause-btn"></i>
                <i class="fa-solid fa-forward-step" id="next-btn"></i>
            </div>
            <div class="progress-area">
                <span id="current-time">00:00</span>
                <input type="range" id="progress-bar" value="0" min="0" max="100">
                <span id="total-duration">00:00</span>
            </div>
        </div>
        <div class="player-right">
            <i class="fa-solid fa-volume-high"></i>
            <input type="range" id="volume-bar" min="0" max="1" step="0.1" value="1">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
